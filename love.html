<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>I Love You</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background-color: #f9cdd4;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: sans-serif;
      overflow: hidden;
    }

    .heart-container {
      position: relative;
      width: 240px;    /* doubled */
      height: 220px;   /* doubled */
      cursor: pointer;
      transform: scale(0);
      animation: popHeart 1s forwards;
    }

    /* Heart shape */
    .heart {
      position: relative;
      width: 240px;    /* doubled */
      height: 220px;   /* doubled */
      background: rgb(239, 88, 88);
      transform: rotate(-45deg);
      border-radius: 30px 30px 0 0; /* doubled */
      box-shadow: 0 0 20px rgba(239, 88, 88, 0.8); /* bigger shadow */
    }

    .heart::before,
    .heart::after {
      content: "";
      position: absolute;
      width: 240px;    /* doubled */
      height: 220px;   /* doubled */
      background: rgb(239, 88, 88);
      border-radius: 50%;
      box-shadow: 0 0 20px rgba(239, 88, 88, 0.8); /* bigger shadow */
    }

    .heart::before {
      top: -120px;     /* doubled */
      left: 0;
    }

    .heart::after {
      top: 0;
      left: 120px;     /* doubled */
    }

    /* Text inside heart */
    .text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      color: white;
      font-size: 44px;  /* doubled */
      font-weight: bold;
      text-align: center;
      animation: popText 0.8s forwards;
      animation-delay: 1s;
      user-select: none;
      width: 100%;
      pointer-events: none;
    }

    @keyframes popHeart {
      0% { transform: scale(0); }
      60% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    @keyframes popText {
      0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
      50% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1); }
    }
  </style>
</head>
<body>

  <div class="heart-container">
    <div class="heart"></div>
    <div class="text">I Love You Akash
</div>
  </div>

</body>
</html>
